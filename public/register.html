<main id="main-content" class="auth-layout"><section class="card auth-card"><span class="season-pill">ВАЙТЛИСТ</span><h1>Створити акаунт</h1><p>Перший зареєстрований акаунт стане admin. Інші гравці отримують member і проходять модерацію.</p><form class="form" id="register-form"><div class="field"><label for="hc-register-displayName">Імʼя</label><input id="hc-register-displayName" class="input" name="displayName" autocomplete="nickname" placeholder="Sebas"></div><div class="field"><label for="hc-register-login">Логін</label><input id="hc-register-login" class="input" name="login" autocomplete="username" placeholder="khayen" minlength="3" required></div><div class="field"><label for="hc-register-email">Email</label><input id="hc-register-email" class="input" type="email" name="email" autocomplete="email" required></div><div class="field"><label for="hc-register-password">Пароль</label><input id="hc-register-password" class="input" type="password" name="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="hc-register-passwordRepeat">Повтор пароля</label><input id="hc-register-passwordRepeat" class="input" type="password" name="passwordRepeat" autocomplete="new-password" minlength="8" required></div><div class="form-error" role="alert" aria-live="polite"></div><button class="btn btn-primary" type="submit">Зареєструватися</button></form><p>Вже є акаунт? <a class="text-link" href="/login">Увійди</a>.</p></section></main>
