# HOMECRAFT_R515_MANAGED
# Independent virtual host; does not change lihvodruida.pp.ua configuration.
server {
    listen 80;
    server_name homecraft-mc.pp.ua;
    return 301 https://homecraft-mc.pp.ua$request_uri;
}
server {
    listen 443 ssl;
    server_name homecraft-mc.pp.ua;
    ssl_certificate /etc/ssl/homecraft-mc.pp.ua/origin.pem;
    ssl_certificate_key /etc/ssl/homecraft-mc.pp.ua/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 34m;
    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
