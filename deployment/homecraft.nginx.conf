# BEGIN HOMECRAFT
server {
    listen 80;
    server_name homecraft-mc.pp.ua;
    return 301 https://homecraft-mc.pp.ua$request_uri;
}
server {
    listen 443 ssl;
    server_name homecraft-mc.pp.ua;
    ssl_certificate /etc/letsencrypt/homecraft-origin/origin.pem;
    ssl_certificate_key /etc/letsencrypt/homecraft-origin/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 34m;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $homecraft_backend homecraft-web:3000;
    location / {
        proxy_pass http://$homecraft_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr; # sanitized, never user-supplied XFF
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
# END HOMECRAFT
